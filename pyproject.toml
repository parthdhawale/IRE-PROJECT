[project]
name = "trr"
version = "0.1.0"
description = "Template-Residual Retrieval: cutting Document-Level Retrieval Mismatch on LegalBench-RAG"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "datasketch>=1.6",
    "bm25s>=0.2",
    "rapidfuzz>=3.6",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "datasets>=3.0",
    "openpyxl>=3.1",   # Web of Science Meta-data/Data.xlsx (area names)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
