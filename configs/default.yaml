# All tunable parameters live here. Code reads them via trr.config.load_config().

seed: 0

paths:
  raw: data/raw/legalbenchrag          # contains corpus/ and benchmarks/
  cache: data/cache
  tables: results/tables
  figures: results/figures
  runs: results/runs
  notes: results/notes

data:
  download_url: "https://www.dropbox.com/scl/fo/r7xfa5i3hdsbxex1w6amw/AID389Olvtm-ZLTKAPrw6k4?rlkey=5n8zrbk4c08lbit3iiexofmwg&st=0hu354cq&dl=1"
  subsets: [contractnli, cuad, maud, privacy_qa]
  # Mini benchmark = LegalBench-RAG-mini: 194 queries per subset, selected exactly as in
  # legalbenchrag/benchmark.py (tests sorted by a random key seeded on the first snippet's
  # file_path, then the first 194 kept). The retrieval pool is always the FULL subset corpus.
  mini_per_subset: 194

eval:
  ks: [1, 2, 4, 8, 10, 16, 32, 64]   # 10 for nDCG@10
  bootstrap_resamples: 1000
  bootstrap_seed: 0
  # Dev / test split of the queries (trr.eval.splits): a query is dev when its gold document is in
  # one of these routing folds (leak-safe document folds, routing.n_folds), test otherwise. Dev
  # queries choose settings; test queries are scored once.
  dev_folds: [0]

chunking:
  chunk_chars: 500          # LegalBench-RAG baseline: recursive splitter, 500 chars, no overlap
  overlap: 0

embedding:
  dev_model: BAAI/bge-small-en-v1.5
  final_model: BAAI/bge-base-en-v1.5
  device: auto          # resolves to mps (Mac) / cuda / cpu at runtime, whichever is available
  batch_size: 64
  # bge v1.5 instruction for short query -> passage retrieval (from the model card)
  query_prefix: "Represent this sentence for searching relevant passages: "

bm25:
  k1: 1.5
  b: 0.75

hybrid:
  rrf_k: 60
  depth: 200

leaf_store:
  # section-tree baseline: retrieval units are the leaves of data/cache/sections.parquet
  breadcrumb_chars: 200     # parent headings prepended to a leaf for embedding only (cap)

segmentation:
  max_leaf_chars: 1500
  min_leaf_chars: 100
  min_headings: 3           # fewer headings than this -> paragraph fallback

minhash:
  num_perm: 128
  shingle_words: 5
  short_section_words: 40   # sections shorter than this use 3-word shingles
  short_shingle_words: 3

h1:
  taus: [0.3, 0.5, 0.7, 0.9]
  go_tau: 0.5
  go_median_share: 0.25

routing:
  n_folds: 5              # document-level folds; routers are scored only on held-out documents
  dup_tau: 0.8            # document MinHash Jaccard >= this -> near-duplicates, kept in one fold
  min_group_docs: 5       # CUAD types smaller than this are merged into "cuad/Other"
  excerpt_chars: 2000     # leading characters of a document embedded for its group centroid
  vocab_per_group: 200    # words kept per group, ranked by p_in * log(p_in / p_out)
  vocab_alpha: 1.0        # Laplace smoothing of the document-frequency rates p_in, p_out
  band_low: 0.01          # the band keeps words in >= 1% ... (fixed before seeing any results)
  band_high: 0.5          # ... and <= 50% of the training documents
  # sensitivity tables only -- never used to pick the band. low=0 keeps every word seen at least
  # once, high=1 keeps words in every document; pairs with low >= high are skipped.
  band_sweep_low: [0.0, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]
  band_sweep_high: [0.1, 0.25, 0.5, 0.75, 1.0]
  # conc_lr: band words that are also concentrated in one group (routers.concentrated_vocab).
  # Defaults fixed before any conc_lr result (reasoning in results/notes/conc_lr.md):
  conc_min_in: 2          # m: in >= 2 training documents of its best group (drops one-off names/typos)
  conc_purity: 0.33       # p: balanced purity >= 1/3, i.e. concentrated in at most ~3 groups (top-3 gate)
  conc_band_low: 0.0      # the frequency floor is left to m: a 1% floor of a large pool removes words
  conc_band_high: 0.5     # that are frequent inside one small group but rare overall
  conc_sweep_min_in: [1, 2, 3, 5, 10]                  # sensitivity tables only
  conc_sweep_purity: [0.0, 0.2, 0.33, 0.5, 0.7, 0.9]
  conc_sweep_band_low: [0.0, 0.01]
  nb_alpha: 1.0           # Laplace smoothing of Naive Bayes word distributions P(w | group)
  lr_c: 1.0               # inverse L2 regularisation strength of the logistic regression
  lr_max_iter: 2000
  top_b: [1, 2, 3]        # routing accuracy is reported for the gold group within the top-B
  go_b: 2                 # CI column for the flat (28-group) reference level
  fuse_rrf_k: 60          # reciprocal rank fusion constant for the fused router (as hybrid.rrf_k)
  # Separate gates per level (set after the flat v1/v2 results were seen -- stated in the notes).
  # coarse: 4 classes, a miss can cost a 21%-of-corpus group, so top-1.
  # fine: 25 CUAD types, searching 3 of them covers ~4-14% of the corpus, so top-3.
  gates:
    coarse: {b: 1, accuracy: 0.95}
    fine: {b: 3, accuracy: 0.95}

group_first:
  # Group-first retrieval on ONE mixed pool of all 714 documents (src/trr/retrievers/group_first.py).
  # "none" = no routing (flat mixed-pool baseline), "oracle" = gold group (routing upper bound).
  routers: [none, oracle, centroid, nb_all, nb_band, fused]
  beams: [1, 2, 3]          # top-B groups searched (ignored for none / oracle)
  # *_hdr = doc-first that picks the document with the query header only (query_split.py);
  # docfirst_local_rrf = RRF of the header-only and full-query document rankings
  inners: [dense, hybrid, docfirst, docfirst_local, docfirst_hdr, docfirst_local_hdr, docfirst_local_rrf]
  table_ks: [1, 8, 64]

band_clusters:
  # E11 band pipeline: mid-band clusters -> mid-band query routing -> rare-in-cluster document
  # choice -> passage inside that document. Defaults pre-registered on 2026-11-12, before any result
  # (results/notes/experiment_log.md, E11); the grids are searched on DEV queries only.
  # Mid band ("what kind of document"): clusters and routing. The floor is an absolute number of
  # documents, not a share: a share grows with the pool and starts dropping topic words (E6, E9).
  min_df: 5               # a word in >= 5 documents ...
  max_frac: 0.5           # ... and in <= 50% of the documents
  # Rare band ("which document"): query words in fewer than rare_below documents OF THE CHOSEN
  # CLUSTER (counted inside the cluster, numbers kept: amounts, dates, ids identify documents).
  rare_below: 5           # = min_df: the two bands meet at one cut-off
  k: 8                    # clusters (spherical k-means on L2-normalised mid-band tf-idf)
  b: 2                    # clusters searched per query
  kmeans_n_init: 10       # k-means restarts; the best (highest total cosine to own centroid) is kept
  kmeans_max_iter: 300
  passage: bm25           # passage step inside the chosen document: bm25 (fully lexical) | dense
  # dev grid. Selection: document recall@1 averaged over all dev QUERIES (not macro over subsets:
  # PrivacyQA has a single dev document, which would weigh 1/4 in a macro); ties -> smaller k, then
  # smaller b. Test results are reported macro over subsets, as in the earlier tables.
  sweep_min_df: [2, 5, 20]
  sweep_max_frac: [0.25, 0.5]
  sweep_rare_below: [2, 5, 10]
  sweep_k: [4, 8, 16, 32]
  sweep_b: [1, 2, 3]
  # reporting (scripts/run_band_pipeline.py); none of these choose a setting
  ci_metrics: ["doc_recall@1", "drm@8", "ndcg@10"]   # document-level paired bootstrap on test
  add_doc_trials: 20      # documents timed when measuring "add one document" (median reported)
  smoke_queries: 5        # --smoke: queries per subset and side

# External, non-legal two-level hierarchy for the document-grouping test (scripts/run_wos_grouping.py).
# Same routers, routing parameters, folds and gates as LegalBench-RAG; only the documents differ.
wos:
  root: data/external/wos     # unzipped Mendeley release (WOS.zip)
  version: WOS46985           # 46,985 abstracts, 7 domains -> 134 areas
  sweep_folds: 1              # folds scored by the sweeps: fold 0 = ~9,400 held-out abstracts (SE of an
                              # accuracy ~0.005); all 5 would take many hours of logistic regressions

# E11 on CLERC (jhu-clsp/CLERC on Hugging Face): full US federal court cases, no class labels, so the
# band clusters are the only grouping. Licence not stated in the release: private use only, never
# redistributed. Pool and queries: scripts/build_clerc_pool.py (Kaggle); loader: trr/data/clerc.py.
clerc:
  hf_repo: jhu-clsp/CLERC     # Hugging Face dataset repo (files fetched with huggingface_hub, resumable)
  queries_file: teva_train_dir/train_data.jsonl.gz   # query + 1 positive + 20 negative PASSAGES (ids = passage ids)
  pid2did_file: collection/mapping.pid2did.tsv       # passage id -> case id
  docs_file: collection/collection.doc.tsv.gz        # case id \t full text (one line per case, no line breaks)
  root: data/external/clerc
  # Pool: queries in a seeded random order; each adds its gold case and its CLERC negative cases
  # (negative passages mapped to cases, duplicates and the gold case removed) until pool_docs cases.
  # No random fill: only CLERC's own documents. Larger pools continue the same order (nested).
  pool_docs: 10000
  # The query's own source opinion (the citing case) would match the query verbatim. A pool case
  # holding >= source_min_probes of the query's source_probes word windows (source_probe_words long),
  # among the query's top source_check_top full-query BM25 cases, is that source: it is removed from
  # the pool (or, if it is some query's gold case, the query is dropped).
  source_probe_words: 12
  source_probes: 3
  source_min_probes: 2
  source_check_top: 5
  dev_share: 0.2              # share of gold cases whose queries are dev (the rest are test)
  # fixed windows with overlap: CLERC texts have no line breaks, so paragraph splitting finds nothing
  chunking: {method: fixed, chunk_chars: 500, overlap: 100}
  # E11 dev grid on CLERC: k scaled to a 10k-case pool; the other grids as for LegalBench
  sweep_k: [8, 16, 32, 64, 128]
  doc_list: 10                # documents ranked per query (document recall@10, nDCG@10, MRR); ci_metrics use it
  ci_metrics: ["rdoc_recall@1", "rdoc_mrr", "rdoc_ndcg@10", "drm@8"]
